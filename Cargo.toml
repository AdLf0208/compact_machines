[package]
# Port of Compact Machines 7.0.81 (CompactMods/CompactMachines, MIT). Minecraft Java
# 1.21.1 NeoForge; the port targets Horizon 26.3 at the pin in horizon-mod.toml.
# Clean-room Rust rewrite from the mod's behaviour (FINDINGS.md).
#
# Cargo's name and version are not the mod's identity: horizon-mod.toml is.
name = "compactmachines"
version = "0.2.2"
edition = "2024"
license = "MIT"
description = "Compact Machines for Horizon: a machine that owns a room you can enter and leave"
publish = false

[lib]
# The pure rules are `src/runtime.rs`; the crate root is `src/lib.rs`.
path = "src/lib.rs"

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod`
# command (the launcher builds against its own copy of the same build). This port
# adds no registry dependency of its own.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
